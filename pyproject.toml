[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici_mlops"
version = "0.0.1"
description = "Realizar tareas de manipulaci\u00f3n, preparaci\u00f3n, exploraci\u00f3n y preprocesamiento de datos, gestionando grandes vol\u00famenes de datos distribuidos y aplicando t\u00e9cnicas de versionado de datos para asegurar la reproducibilidad y trazabilidad en proyectos de Machine Learning."
authors = [
  { name = "ITESM IAA Equipo 43" },
]

readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["mibici_mlops"]
include = ["pyproject.toml", "mibici_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici_mlops"]
force-sort-within-sections = true


[tool.bandit]
# Análisis estático de seguridad: `bandit -c pyproject.toml -r mibici_mlops scripts tests`
exclude_dirs = [".venv", ".venv-deepchecks", "notebooks"]

[tool.bandit.assert_used]
# En las pruebas, `assert` es la forma de PyTest de comprobar resultados (B101 no aplica).
skips = ["*/tests/*", "tests/*"]
