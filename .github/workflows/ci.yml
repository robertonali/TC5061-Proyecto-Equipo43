name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Que una versión falle no cancela la otra: así se ve si el problema es de una sola.
      fail-fast: false
      matrix:
        include:
          # La versión del proyecto (python_env.yaml, pyproject.toml y la imagen de la API).
          - python-version: "3.13"
            pip-extra: ""
            pytest-extra: ""
          # Compatibilidad con 3.12, la versión del entorno de DeepChecks. El proyecto fija 3.13
          # (requires-python ~=3.13.0), así que se instala sin esa restricción y se omite la única
          # prueba que exige 3.13: la que compara la versión con python_env.yaml.
          - python-version: "3.12"
            pip-extra: "--ignore-requires-python"
            pytest-extra: "--deselect tests/test_environment.py::test_version_de_python_coincide_con_python_env"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: pip install ${{ matrix.pip-extra }} -r requirements.txt
      # Las pruebas que necesitan los modelos o datos reales se omiten solas (skipif) si no existen.
      - name: Pruebas
        run: python -m pytest -q ${{ matrix.pytest-extra }}

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # models/servicio/ está en .gitignore (los modelos salen del registry), pero la imagen lo copia.
      # Si no hay modelos exportados, la imagen se construye vacía y solo valida el build.
      - name: Asegurar models/servicio
        run: mkdir -p models/servicio
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: mibici-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validar docker-compose.yml
        run: docker compose config --quiet

  # Levanta MLflow con el compose y comprueba que responde. La API no se levanta aquí: su imagen
  # necesita los modelos exportados del registry, que no están en Git.
  compose:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      # --wait espera al healthcheck del servicio (GET /health) y falla si no queda sano a tiempo.
      - name: Levantar MLflow
        run: docker compose up -d --wait --wait-timeout 180 mlflow
      - name: Verificar /health
        run: curl -fsS http://localhost:5000/health
      - name: Logs de MLflow
        if: failure()
        run: docker compose logs mlflow
      # -v borra también el volumen mlflow-data; corre aunque un paso anterior falle.
      - name: Bajar el compose
        if: always()
        run: docker compose down -v

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Solo al llegar a master: los pull requests y las demás ramas no publican.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Igual que en build: sin modelos exportados, la imagen se publica con models/servicio/ vacío.
      - name: Asegurar models/servicio
        run: mkdir -p models/servicio
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR exige el nombre en minúsculas, por eso no se usa github.repository.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/robertonali/mibici-api:latest
            ghcr.io/robertonali/mibici-api:${{ github.sha }}
          cache-from: type=gha
