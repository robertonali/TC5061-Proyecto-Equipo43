name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      # Las pruebas que necesitan los modelos o datos reales se omiten solas (skipif) si no existen.
      - name: Pruebas
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # models/servicio/ está en .gitignore (los modelos salen del registry), pero la imagen lo copia.
      # Si no hay modelos exportados, la imagen se construye vacía y solo valida el build.
      - name: Asegurar models/servicio
        run: mkdir -p models/servicio
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: mibici-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validar docker-compose.yml
        run: docker compose config --quiet

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Solo al llegar a master: los pull requests y las demás ramas no publican.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Igual que en build: sin modelos exportados, la imagen se publica con models/servicio/ vacío.
      - name: Asegurar models/servicio
        run: mkdir -p models/servicio
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR exige el nombre en minúsculas, por eso no se usa github.repository.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/robertonali/mibici-api:latest
            ghcr.io/robertonali/mibici-api:${{ github.sha }}
          cache-from: type=gha
